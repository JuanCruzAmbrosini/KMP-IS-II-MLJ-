spring.application.name=gemini-app
server.port=8080

# Configuracion de Google Cloud / Vertex AI Gemini
spring.ai.vertex.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT_ID:my-gcp-project}
spring.ai.vertex.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.ai.vertex.ai.gemini.chat.options.temperature=0.7

