server.port=8080

# Configuracion de Base de Datos SQLite
spring.datasource.url=jdbc:sqlite:biblioteca.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optimizaciones SQLite
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ====================================================================
# Configuracion de Automatizacion (Scheduling) y Notificaciones Email
# ====================================================================
# Expresion cron para comprobacion diaria (por defecto a las 08:00 AM)
biblioteca.scheduling.cron.recordatorios=0 0 8 * * ?
biblioteca.scheduling.cron.cumpleanios=0 0 8 * * ?

# Datos institucionales de la facultad para salutaciones
biblioteca.facultad.url=https://frm.utn.edu.ar
biblioteca.facultad.nombre=Universidad Tecnologica Nacional - FRM

# Modo de envio de correos:
# false = Modo simulador en consola y log web (ideal para evaluacion/testing sin servidor SMTP)
# true  = Envio real mediante JavaMailSender (requiere credenciales SMTP validas)
biblioteca.mail.enabled=false
biblioteca.mail.from=biblioteca.universitaria@frm.utn.edu.ar

