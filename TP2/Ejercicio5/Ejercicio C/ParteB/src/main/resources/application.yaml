spring:
  application:
    name: springboot-jwt-auth-demo
  datasource:
    url: jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

