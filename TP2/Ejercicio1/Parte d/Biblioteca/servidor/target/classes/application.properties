server.port=8080

spring.datasource.url=jdbc:sqlite:biblioteca.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQLite optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20

# PDF de los libros: carpeta del disco del servidor donde se guardan como libro_<nombre>.pdf
biblioteca.pdf.directorio=C:/biblioteca
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Para que el cliente pueda mostrar el motivo cuando el servidor rechaza una operacion
server.error.include-message=always
