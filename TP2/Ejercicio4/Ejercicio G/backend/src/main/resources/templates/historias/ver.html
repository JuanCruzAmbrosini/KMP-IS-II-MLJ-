<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clínica - Versión Java MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .timeline-item { border-left: 3px solid #0d6efd; padding-left: 20px; position: relative; margin-bottom: 25px; }
        .timeline-dot { width: 12px; height: 12px; background: #0d6efd; border-radius: 50%; position: absolute; left: -7.5px; top: 5px; }
        .patient-badge { background: #e0f2fe; color: #0369a1; border-radius: 8px; padding: 12px 16px; }
    </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 900px;">
    <div class="mb-3">
        <a th:href="@{/mvc/pacientes}" class="btn btn-sm btn-outline-secondary">← Volver al Listado</a>
    </div>

    <!-- Encabezado del Paciente -->
    <div class="card card-custom bg-white p-4 mb-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div th:if="${not #lists.isEmpty(paciente.fotos)}">
                    <img th:src="@{'/mvc/pacientes/foto/' + ${paciente.fotos[0].id}}" 
                         style="width: 70px; height: 70px; object-fit: cover; border-radius: 50%;" 
                         class="border shadow-sm" alt="Foto Paciente">
                </div>
                <div>
                    <h2 class="h4 fw-bold text-dark mb-1" th:text="${paciente.apellido + ', ' + paciente.nombre}">Pérez, Juan</h2>
                    <p class="text-muted mb-0">Documento: <strong th:text="${paciente.documento}">12345678</strong> | ID: <span class="small font-monospace" th:text="${paciente.id}">UUID</span></p>
                </div>
            </div>
            <div class="patient-badge">
                <span class="small fw-bold">Estado: Historia Activa</span>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Formulario para agregar DetalleHistoriaClinica -->
        <div class="col-md-5 mb-4">
            <div class="card card-custom bg-white p-4 sticky-top" style="top: 20px;">
                <h3 class="h5 fw-bold text-dark mb-3">Nueva Entrada Médica</h3>
                <form th:action="@{/mvc/historias/detalle}" th:object="${nuevoDetalle}" method="post">
                    <input type="hidden" th:field="*{pacienteId}">

                    <div class="mb-3">
                        <label for="medicoId" class="form-label fw-semibold">Médico Responsable:</label>
                        <select id="medicoId" th:field="*{medicoId}" class="form-select" required>
                            <option value="">-- Seleccionar Médico --</option>
                            <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nombreCompleto} + ' (' + ${m.documento} + ')'">
                                Dr. House
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="detalleHistoria" class="form-label fw-semibold">Evolución / Diagnóstico:</label>
                        <textarea id="detalleHistoria" th:field="*{detalleHistoria}" rows="4" class="form-control" 
                                  placeholder="Ingrese evolución clínica, diagnóstico o tratamiento indicado..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-semibold">
                        + Registrar Detalle
                    </button>
                </form>
            </div>
        </div>

        <!-- Historial cronológico de Detalles -->
        <div class="col-md-7">
            <div class="card card-custom bg-white p-4">
                <h3 class="h5 fw-bold text-dark mb-4">Evoluciones Médicas Registradas</h3>

                <div th:if="${#lists.isEmpty(historias) or #lists.isEmpty(historias[0].detalles)}" class="text-center py-5 text-muted">
                    <p class="mb-0">El paciente aún no cuenta con detalles médicos en su historia clínica.</p>
                </div>

                <div th:each="h : ${historias}">
                    <div th:each="d : ${h.detalles}" class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-primary-subtle text-primary fw-semibold" 
                                  th:text="${d.medico.nombreCompleto}">Dr. Pérez</span>
                            <span class="text-muted small" 
                                  th:text="${#dates.format(d.fechaHistoria, 'dd/MM/yyyy HH:mm')}">18/10/2026 14:30</span>
                        </div>
                        <p class="text-secondary mt-2 mb-0" style="white-space: pre-line;" th:text="${d.detalleHistoria}">
                            Descripción de la consulta y medicación.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
