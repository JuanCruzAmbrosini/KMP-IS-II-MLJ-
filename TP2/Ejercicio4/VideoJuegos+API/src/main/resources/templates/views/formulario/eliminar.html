<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Eliminar videojuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>
<section class="py-5">
<div class="container px-4 px-lg-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body p-4 text-center">
          <h4 class="fw-bolder mb-4">Esta seguro de eliminar este videojuego?</h4>
          <form th:action="@{/eliminar/videojuego/{id}(id=${videojuego.id})}" method="post">
            <div class="row g-2">
              <div class="col-6">
                <button class="btn btn-outline-danger w-100" type="submit">Si, eliminar</button>
              </div>
              <div class="col-6">
                <a class="btn btn-dark w-100" th:href="@{/crud}">Cancelar</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
