<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>

    <!--Select en Forms-->

    <div class="container py-4">
        <form action="">

                <option value="">2</option>

                <option value="">4</option>

            <select class="form-select mb-3 form-select-lg" name="" id="">

                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>
            </select>
            <select class="form-select mb-3 form-select-sm" name="" id="">

                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>
            </select>
            <select class="form-select mb-3" name="" id="" disabled>
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>
            </select>
            <select class="form-select mb-3" name="" id="" multiple>

                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>

        </form>

</html>
