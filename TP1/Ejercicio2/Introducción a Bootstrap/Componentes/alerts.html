<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="container py-4">
        <div class="alert alert-primary alert-dismissible">
            <span>Esta es una alerta primaria <a class="alert-link" href="">Ir al sitio web</a></span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-secondary alert-dismissible">
            <span>Esta es una alerta secundaria</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-success alert-dismissible">
            <span>Esta es una alerta success</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-danger alert-dismissible">
            <span>Esta es una alerta danger</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-warning alert-dismissible">
            <span>Esta es una alerta warning</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-info alert-dismissible">
            <span>Esta es una alerta info</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-light alert-dismissible">
            <span>Esta es una alerta light</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
        <div class="alert alert-dark alert-dismissible">
            <span>Esta es una alerta dark</span>
            <button class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
                ></button>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
