<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="container py-4">
        <span class="badge bg-primary">Primary</span>
        <span class="badge bg-secondary">Secondary</span>
        <span class="badge bg-warning">Warning</span>
        <span class="badge bg-info">Info</span>
        <span class="badge bg-light text-dark">Light</span>
        <hr>
        <span class="badge bg-primary rounded-pill">Primary</span>
        <span class="badge bg-secondary rounded-pill">Secondary</span>
        <span class="badge bg-warning rounded-pill">Warning</span>
        <span class="badge bg-info rounded-pill">Info</span>
        <span class="badge bg-light text-dark rounded-pill">Light</span>
        <hr>
        <h1>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h1>
        <h2>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h2>
        <h3>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h3>
        <h4>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h4>
        <h5>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h5>
        <h6>Encabezado de ejemplo <span class="badge bg-info">nuevo</span></h6>
        <hr>
        <button class="btn btn-info">
            Notificaciones <span class="badge bg-warning">5</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
