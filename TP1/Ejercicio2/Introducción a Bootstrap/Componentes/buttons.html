<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="container py-4">
        
        <button class="btn btn-info">
            Info
        </button>

        <button class="btn btn-success">
            Success
        </button>

        <button class="btn btn-danger">
            Danger
        </button>

        <hr>

        <button class="btn btn-link">
            Enlace
        </button>

        <hr>

        <a class="btn btn-warning" href="">Enlace en forma de botón</a> 
        <input class="btn btn-primary" type="button" value="Input Button">
        <input class="btn btn-secondary" type="submit" value="Input Sumbit">

        <hr>

        <button class="btn btn-outline-info">
            Info
        </button>

        <button class="btn btn-outline-success">
            Success
        </button>

        <button class="btn btn-outline-danger">
            Danger
        </button>

        <hr>

        <button class="btn btn-outline-info btn-sm">
            Info
        </button>

        <button class="btn btn-outline-success">
            Success
        </button>

        <button class="btn btn-outline-danger btn-lg">
            Danger
        </button>
        
        <hr>

        <button class="btn btn-info btn" disabled>
            Info
        </button>

        <a class="btn btn-primary disabled" href="">
            Pimary
        </a>

        <hr>

        <div class="d-grid gap-2">
            <button class="btn btn-info btn">
                Info
            </button>
            <button class="btn btn-info btn active">
                Info
            </button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
