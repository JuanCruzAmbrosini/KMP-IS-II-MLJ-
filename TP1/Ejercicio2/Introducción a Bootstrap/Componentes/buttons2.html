<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="container py-4">
        
        <div class="btn-group">

            <button class="btn btn-info">Izquierdo</button>
            <button class="btn btn-info active">Centro</button>
            <button class="btn btn-info">Derecho</button>
            
        </div>

        <hr>

        <div class="btn-group">
            
            <a class="btn btn-primary" href="">Izquierda</a>
            <a class="btn btn-outline-warning " href="">Centro</a>
            <a class="btn btn-danger" href="">Derecha</a>

        </div>

        <hr>

        <div class="btn-group">
            <input class="btn-check" type="checkbox" name="" id="btn-check1">
            <label class="btn btn-outline-warning " for="btn-check1">Checkbox 1</label>
            <input class="btn-check" type="checkbox" name="" id="btn-check2">
            <label class="btn btn-outline-warning " for="btn-check2">Checkbox 2</label>
            <input class="btn-check" type="checkbox" name="" id="btn-check3">
            <label class="btn btn-outline-warning " for="btn-check3">Checkbox 3</label>
        </div>

        <hr>

        <div class="btn-group">
            <input class="btn-check" type="radio" name="btn-radio" id="btn-radio1">
            <label class="btn btn-outline-success " for="btn-radio1">Radio 1</label>
            <input class="btn-check" type="radio" name="btn-radio" id="btn-radio2">
            <label class="btn btn-outline-success " for="btn-radio2">Radio 2</label>
            <input class="btn-check" type="radio" name="btn-radio" id="btn-radio3">
            <label class="btn btn-outline-success " for="btn-radio3">Radio 3</label>
        </div>

        <hr>

        <div class="btn-group btn-group-lg">

            <button class="btn btn-info">Izquierdo</button>
            <button class="btn btn-info active">Centro</button>
            <button class="btn btn-info">Derecho</button>
            
        </div>

        <div class="btn-group">

            <button class="btn btn-info">Izquierdo</button>
            <button class="btn btn-info active">Centro</button>
            <button class="btn btn-info">Derecho</button>
            
        </div>

        <div class="btn-group btn-group-sm">

            <button class="btn btn-info">Izquierdo</button>
            <button class="btn btn-info active">Centro</button>
            <button class="btn btn-info">Derecho</button>
            
        </div>

        <hr>

        <div class="btn-group-vertical">

            <button class="btn btn-info">Izquierdo</button>
            <button class="btn btn-info active">Centro</button>
            <button class="btn btn-info">Derecho</button>
            
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
