<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>

    <!--Manejo báisco de formularios-->

    <div class="container">
        <form action="">
            <div class="mb-3">
                <label class="form-label" for="name">Nombre</label>
                <input placeholder="Ingrese su nombre" class="form-control form-control-sm" name="name" type="text" id="name" disabled>
            </div>
            <div class="mb-3 row">
                <label class="col-form-label col-2" for="email">E-mail:</label>
                <div class="col-10">
                    <input value="jc@hotmail.com" placeholder="Ingrese su e-mail" class="form-control-plaintext" name="email" type="email" id="email" disabled readonly>
                </div>
            </div>
            <div>
                <label class="form-label" for="description">Description</label>
                <textarea placeholder="Escriba una breve descripción" class="form-control" name="description" id="description" cols="30" rows="10" ></textarea>
            </div>
        </form>
    </div> 
</body>
</html>
