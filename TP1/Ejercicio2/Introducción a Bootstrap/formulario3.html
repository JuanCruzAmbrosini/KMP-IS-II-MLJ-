<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>

    <!--Input File en Forms-->

    <div class="container py-4">
        <form action="">
            <div class="mb-3">
                <label class="form-label" for="formFile">Input File Indeterminado</label>
                <input class="form-control" type="file" name="" id="formFile">
            </div>
            <div class="mb-3">
                <label class="form-label" for="formFileMultiple">Input File multiple</label>
                <input class="form-control" type="file" name="" id="formFile" multiple>
            </div>
            <div class="mb-3">
                <label class="form-label" for="formFileDisabled">Input File deshabilitado</label>
                <input class="form-control" type="file" name="" id="formFile" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label" for="formFileLg">Input File Lg</label>
                <input class="form-control form-control-lg" type="file" name="" id="formFileLg">
            </div>
        </form>
    </div>

</body>
</html>
