<h3 class="text-center">Carrusel</h3>

    <div id="carouselExampleSlidesOnly" class="carousel slide mx-auto" data-bs-ride="carousel"  style="max-width: 700px;">
        <!-- la difrencia entre mx-auto y text-center es que mx-auto centra el elemento horizontalmente mientras que text-center lo centra verticalmente -->
        <div class="carousel-inner">
            <div class="carousel-item active">
            <img src="Speed Slide.jpeg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="kai cenat slide.jpeg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="Logan slide.jpeg" class="d-block w-100" alt="...">
            </div>
        </div>
    </div>


    <form   class="container mt-5 mb-3"> <!-- mt y mb lo que hacen es agregar margen superior e inferior al formulario -->
        <h5> formulario </h5>    
        <div style="border: 1px solid white;" class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Direcciond e correo</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        </div>
        <div style="border: 1px solid white;" class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div style="border: 1px solid white;" class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Verificar</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <h3 class="text-center">Containers</h3>

    <div class="container text-center bg-warning"> <!--(amarillo, texto centrado) container es un contenedor que tiene un ancho máximo y se centra en la pantalla -->
        <h5>Container</h5>
        <div class="row"> 
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 1</div> <!-- col sm y md significa que en pantallas pequeñas ocupará todo el ancho y en pantallas medianas ocupará la mitad -->
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 2</div> 
            <div class="col-sm-12 col-lg-4">Columna 3</div>
        </div>
    </div>
    <div class="container-fluid text-center bg-warning mb-2"> <!-- container fluido es un contenedor que ocupa el 100% del ancho de la pantalla -->
        <h5>Container Fluid</h5>
        <div class="row"> 
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 1</div> <!-- col sm y md significa que en pantallas pequeñas ocupará todo el ancho y en pantallas medianas ocupará la mitad -->
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 2</div> 
            <div class="col-sm-12 col-lg-4">Columna 3</div>
        </div>
    </div>
    <div class="container-xxl text-center bg-warning mb-2"> <!-- container xxl es un contenedor que tiene un ancho máximo de 1320px -->
        <h5>Container XXL</h5>
        <div class="row"> 
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 1</div> <!-- col sm y md significa que en pantallas pequeñas ocupará todo el ancho y en pantallas medianas ocupará la mitad -->
            <div class="col-sm-12 col-md-6 col-lg-4">Columna 2</div> 
            <div class="col-sm-12 col-lg-4 col-xl-4">Columna 3</div>
        </div>
    </div>
