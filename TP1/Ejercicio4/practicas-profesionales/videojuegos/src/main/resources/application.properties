spring.application.name=videojuegos

# Conexión a la base de datos que acabamos de crear
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/videojuegos?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Como el script ya creó las tablas, dejamos que Hibernate solo actualice si hay cambios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect