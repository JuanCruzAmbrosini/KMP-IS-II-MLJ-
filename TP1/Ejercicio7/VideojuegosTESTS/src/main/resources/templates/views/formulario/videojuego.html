<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Formulario Videojuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>
<section class="py-5">
<div class="container px-4 px-lg-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card">
        <div class="card-body p-4">
          <h4 class="fw-bolder mb-4">Datos del videojuego</h4>
          <form th:action="@{/formulario/videojuego/{id}(id=${videojuego.id})}" method="post" th:object="${videojuego}" enctype="multipart/form-data">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="titulo" class="form-label">Titulo</label>
                <input type="text" class="form-control" id="titulo" th:field="*{titulo}">
                <div class="text-danger" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
              </div>
              <div class="col-md-6">
                <label for="estudio" class="form-label">Estudio</label>
                <select class="form-select" id="estudio" th:field="*{estudio}">
                  <option th:each="estudio: ${estudios}" th:value="${estudio.id}" th:text="${estudio.nombre}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('estudio')}" th:errors="*{estudio}"></div>
              </div>
              <div class="col-md-12">
                <label for="archivo" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="archivo" name="archivo">
                <div class="text-danger" th:if="${errorImagenMsg}" th:text="${errorImagenMsg}"></div>
              </div>
              <input type="hidden" id="imagen" th:field="*{imagen}" name="imagen">
              <div class="col-md-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" class="form-control" id="precio" th:field="*{precio}">
                <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
              </div>
              <div class="col-md-3">
                <label for="fechaLanzamiento" class="form-label">Fecha de lanzamiento</label>
                <input type="date" class="form-control" id="fechaLanzamiento" th:field="*{fechaLanzamiento}">
                <div class="text-danger" th:if="${#fields.hasErrors('fechaLanzamiento')}" th:errors="*{fechaLanzamiento}"></div>
              </div>
              <div class="col-md-3">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-select" id="categoria" th:field="*{categoria}">
                  <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
              </div>
              <div class="col-md-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" class="form-control" id="stock" th:field="*{stock}">
                <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
              </div>
              <div class="col-md-12">
                <label for="descripcion" class="form-label">Descripcion</label>
                <textarea class="form-control" id="descripcion" rows="5" th:field="*{descripcion}"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
              </div>
            </div>
            <div class="row mt-4 g-2">
              <div class="col-md-6">
                <button class="btn btn-outline-secondary w-100" type="reset">Resetear formulario</button>
              </div>
              <div class="col-md-6">
                <button class="btn btn-dark w-100" type="submit">Guardar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
