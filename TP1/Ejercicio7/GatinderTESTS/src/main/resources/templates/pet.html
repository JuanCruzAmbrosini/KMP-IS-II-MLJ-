<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>Tinder de Mascota - Registro</title>

  <!-- Bootstrap core CSS -->
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom fonts for this template -->
  <link href="https://fonts.googleapis.com/css?family=Catamaran:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lato:100,100i,300,300i,400,400i,700,700i,900,900i" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="/css/one-page-wonder.min.css" rel="stylesheet">

</head>

<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">Tinder de Mascota</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/register}">Registro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/login">Log In</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header>
      <h1 style="margin-top:80px; text-align: center;"><span th:text="${accion}"></span>Mascota</h1>
  </header>

  <section>
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-6 order-lg-2">
          <div class="p-5">
              <img th:if="${pet.picture != null}" class="img-fluid rounded-circle" th:src="@{/pictures/pet/{id}(id=${pet.id})}" alt="Foto de mascota">
                  
              <img th:if="${pet.picture == null}" class="img-fluid rounded-circle" src="/img/m1.jpeg" alt="Sin foto de mascota">
          </div>
        </div>
        <div class="col-lg-6 order-lg-1">
          <div class="p-5">
            <form th:action="@{/pets/pets/update}" method="post" enctype="multipart/form-data">
                
               <p th:if="${error != null}" th:text="${error}" style="color:red;"></p> 
               
               <input type="hidden" name="id" th:value="${pet.id}"/>
               <input type="hidden" name="action" th:value="${action}"/>
                
              <label>Nombre de la mascota</label>
              <input type="text" class="form-control" name="name" th:value="${pet.name}" required/>
              
              <label>Tipo</label>
              <select class="form-control" name="tipo" th:disabled="${accion == 'Eliminar' OR accion == 'Alta'}"> 
                 <option th:each="animal : ${animals}" th:value="${animal}" th:text="${animal}" th:selected="${pet.animal == animal}"></option>
              </select>
              
              <label>Sexo</label>
              <select class="form-control" name="sexo" th:disabled="${accion == 'Eliminar' OR accion == 'Alta'}"> 
                 <option th:each="gender : ${genders}" th:value="${gender}" th:text="${gender}" th:selected="${pet.gender == gender}"></option>
              </select>

              <label th:if="${accion != 'Eliminar'}">Foto</label>
              <input type="file" class="form-control" name="archivo" th:if="${accion != 'Eliminar' OR accion == 'Alta'}"/>
              
              <br/>
              
                 <a th:href="@{/pets/pets/list}" class="btn btn-dark">Volver</a>
                 <button type="submit" class="btn btn-primary" th:text="${action == 'create' ? 'Crear Mascota' : 'Actualizar Mascota'}">Guardar Mascota</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>


  <!-- Footer -->
  <footer class="py-5 bg-black">
    <div class="container">
      <p class="m-0 text-center text-white small">Copyright &copy; Your Website 2019</p>
    </div>
    <!-- /.container -->
  </footer>

  <!-- Bootstrap core JavaScript -->
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
