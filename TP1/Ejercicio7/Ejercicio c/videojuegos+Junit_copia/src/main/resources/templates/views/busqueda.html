<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Busqueda - UTN Videojuegos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
  <nav th:replace="components/navbar :: nav_bar"></nav>
  <section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
      <div th:if="${videojuegos.size}">
        <h2 class="fw-bolder mb-4">Resultados de "<span th:text="${resultado}"></span>"</h2>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
          <div class="col mb-5" th:each="videojuego : ${videojuegos}">
            <div th:replace="components/card :: _card"></div>
          </div>
        </div>
      </div>
      <div th:unless="${videojuegos.size}" class="text-center py-5">
        <h2 class="fw-bolder">No hay resultados para "<span th:text="${resultado}"></span>"</h2>
      </div>
    </div>
  </section>
  <footer class="py-5 bg-dark">
    <div class="container"><p class="m-0 text-center text-white">Copyright &copy; UTN Videojuegos 2026</p></div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
