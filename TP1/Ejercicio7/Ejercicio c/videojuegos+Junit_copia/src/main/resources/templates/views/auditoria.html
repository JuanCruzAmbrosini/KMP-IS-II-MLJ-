<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de auditoria - UTN Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{components/navbar :: nav_bar}"></nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Historial de cambios</h1>
            <p class="text-muted mb-0">Registro de altas, modificaciones y bajas de videojuegos.</p>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/inicio}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Eventos registrados</h2>
            <span class="badge bg-dark" th:text="${totalAuditorias + ' cambios'}">0 cambios</span>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead><tr><th>Fecha y hora</th><th>Accion</th><th>Videojuego</th><th>Campo</th><th>Valor anterior</th><th>Valor nuevo</th></tr></thead>
                <tbody>
                <tr th:each="auditoria : ${auditorias}">
                    <td th:text="${#temporals.format(auditoria.fecha, 'dd/MM/yyyy HH:mm:ss')}">06/09/2026 20:00:00</td>
                    <td><span class="badge bg-secondary" th:text="${auditoria.accion}">MODIFICAR</span></td>
                    <td><span th:text="${auditoria.tituloVideojuego}">Videojuego</span><small class="d-block text-muted" th:text="${'ID ' + auditoria.videojuegoId}">ID 1</small></td>
                    <td th:text="${auditoria.campo}">precio</td>
                    <td th:text="${auditoria.valorAnterior}">-</td>
                    <td th:text="${auditoria.valorNuevo}">100</td>
                </tr>
                <tr th:if="${#lists.isEmpty(auditorias)}"><td colspan="6" class="text-muted">Todavia no hay cambios registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
