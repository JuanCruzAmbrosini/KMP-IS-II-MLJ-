<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    
    <div class="container">
      <div class="container-form">
        <form class="sing-in">
          <h2>Iniciar Sesión</h2>
          <div class="social-networks">
            <ion-icon name="logo-twitch"></ion-icon>
            <ion-icon name="logo-twitter"></ion-icon>
            <ion-icon name="logo-instagram"></ion-icon>
            <ion-icon name="logo-tiktok"></ion-icon>
          </div>
          <span> Use su correo y contraseña </span>
          <div class="container-input">
           <ion-icon name="mail-outline"></ion-icon>
            <input type ="email" placeholder="Correo Electronico">
          </div>
          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type ="password" placeholder="Password">
          </div>
          <a href="#">¿Olvidaste tu contraseña?</a>
          <button class="button">Iniciar Sesión</button>
      </form>
    </div>
      <div class="container-form">
        <form class="sing-up">
          <h2>Registrarse</h2>
          <div class="social-networks">
            <ion-icon name="logo-twitch"></ion-icon>
            <ion-icon name="logo-twitter"></ion-icon>
            <ion-icon name="logo-instagram"></ion-icon>
            <ion-icon name="logo-tiktok"></ion-icon>
          </div>
          <span> Use su correo electrónico para registrarse </span>
          <div class="container-input">
            <ion-icon name="person-outline"></ion-icon>
            <input type ="text" placeholder="Nombre Completo">
          </div>
          <div class="container-input">
            <ion-icon name="mail-outline"></ion-icon>
            <input type ="email" placeholder="Correo Electronico">
          </div>
          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type ="password" placeholder="Password">
          </div>
          <button class="button">Registrarse</button>
        </form>
      </div>
      <div class="container-welcome">
        <div class="welcome-sing-up welcome">
          <h3>¡Bienvenido!</h3>
          <P>Ingrese sus datos personales para usar todas las funciones del sitio</P>
          <button class="button" id = "btn-sing-up">Registrarse</button>
        </div>
        <div class="welcome-sing-in welcome">
          <h3>¡Hola!</h3>
          <p>Registrese con sus datos personales para usar todas las funciones del sitio</p>
          <button class="button" id = "btn-sing-in">Iniciar Sesión</button>
        </div>
      </div>
    </div>



    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    
</body>
</html>
