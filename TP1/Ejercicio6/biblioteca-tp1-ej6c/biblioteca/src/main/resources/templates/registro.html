<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrarse - Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3 text-center">Crear cuenta</h3>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">DNI</label>
                    <input type="number" th:field="*{dni}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" th:field="*{telefono}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mail (sera tu usuario)</label>
                    <input type="email" th:field="*{mail}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Clave</label>
                    <input type="password" th:field="*{clave}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarme</button>
            </form>
            <a th:href="@{/login}" class="btn btn-link w-100 mt-2">Ya tengo cuenta</a>
        </div>
    </div>
</div>
</body>
</html>
