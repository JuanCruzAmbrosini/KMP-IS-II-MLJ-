<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Libros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Catalogo de libros</h2>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/libros/nuevo}">Nuevo libro</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ISBN</th><th>Titulo</th><th>Año</th><th>Ejemplares</th><th>Disponibles</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${libros}">
            <td th:text="${l.isbn}"></td>
            <td th:text="${l.titulo}"></td>
            <td th:text="${l.anio}"></td>
            <td th:text="${l.ejemplares}"></td>
            <td th:text="${l.ejemplaresRestantes}"></td>
            <td>
                <a class="btn btn-sm btn-outline-secondary" sec:authorize="hasRole('ADMIN')"
                   th:href="@{/libros/editar/{id}(id=${l.id})}">Editar</a>
                <a class="btn btn-sm btn-outline-danger" sec:authorize="hasRole('ADMIN')"
                   th:href="@{/libros/baja/{id}(id=${l.id})}" onclick="return confirm('¿Dar de baja este libro?')">Baja</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
