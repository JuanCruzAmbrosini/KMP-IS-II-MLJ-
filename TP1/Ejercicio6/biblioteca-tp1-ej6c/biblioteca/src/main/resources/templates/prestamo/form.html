<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo prestamo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 480px;">
    <h2>Nuevo prestamo</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/prestamos/guardar}" method="post">
        <div class="mb-3">
            <label class="form-label">Libro</label>
            <select name="libroId" class="form-select" required>
                <option th:each="l : ${libros}" th:value="${l.id}"
                        th:text="${l.titulo + ' (' + l.ejemplaresRestantes + ' disponibles)'}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Solicitar prestamo</button>
        <a th:href="@{/prestamos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
