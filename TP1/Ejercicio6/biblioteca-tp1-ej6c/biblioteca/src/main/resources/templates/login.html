<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingresar - Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3 text-center">Biblioteca</h3>

            <div class="alert alert-danger" th:if="${param.error}">Mail o clave incorrectos.</div>
            <div class="alert alert-success" th:if="${param.logout}">Sesion cerrada correctamente.</div>
            <div class="alert alert-success" th:if="${param.registrado}">Usuario registrado. Ya podes ingresar.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Mail</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Clave</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <hr>
            <a th:href="@{/usuarios/registro}" class="btn btn-link w-100">Crear cuenta nueva</a>
        </div>
    </div>
</div>
</body>
</html>
