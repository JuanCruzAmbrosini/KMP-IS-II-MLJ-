<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 600px;">
    <h2>Libro</h2>
    <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input type="number" th:field="*{isbn}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Titulo</label>
            <input type="text" th:field="*{titulo}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Año</label>
            <input type="number" th:field="*{anio}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Ejemplares totales</label>
            <input type="number" th:field="*{ejemplares}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Autores</label>
            <select multiple th:field="*{autores}" class="form-select">
                <option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.nombre}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Editoriales</label>
            <select multiple th:field="*{editoriales}" class="form-select">
                <option th:each="e : ${editoriales}" th:value="${e.id}" th:text="${e.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/libros}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
