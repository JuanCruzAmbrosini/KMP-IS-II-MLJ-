# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Mendoza&connectTimeout=3000&socketTimeout=5000
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: en desarrollo va bien para ir creando/ajustando tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El dialecto se selecciona automaticamente junto con el DataSource.

# --- Thymeleaf ---
spring.thymeleaf.cache=false

server.port=8080
