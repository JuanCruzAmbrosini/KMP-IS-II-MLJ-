<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de auditoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Historial de auditoria</h2>
        <span class="badge text-bg-secondary" th:text="${historial.size() + ' registros'}"></span>
    </div>
    <div class="alert alert-info" th:if="${historial.isEmpty()}">Todavia no hay cambios registrados.</div>
    <div class="table-responsive" th:unless="${historial.isEmpty()}">
        <table class="table table-striped align-middle">
            <thead>
            <tr><th>Fecha</th><th>Entidad</th><th>ID</th><th>Revision</th><th>Operacion</th></tr>
            </thead>
            <tbody>
            <tr th:each="registro : ${historial}">
                <td th:text="${#temporals.format(registro.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${registro.entidad}"></td>
                <td th:text="${registro.idEntidad}"></td>
                <td th:text="${registro.revision}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${registro.operacion == 'ADD' ? ' text-bg-success' : (registro.operacion == 'DEL' ? ' text-bg-danger' : ' text-bg-warning')}"
                          th:text="${registro.operacion}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
