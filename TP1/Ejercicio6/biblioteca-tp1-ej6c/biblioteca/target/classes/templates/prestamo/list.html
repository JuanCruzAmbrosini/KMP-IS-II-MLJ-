<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Prestamos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Prestamos</h2>
        <a class="btn btn-primary" th:href="@{/prestamos/nuevo}">Nuevo prestamo</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr><th>Libro</th><th>Usuario</th><th>Fecha prestamo</th><th>Fecha devolucion</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${prestamos}">
            <td th:text="${p.libro.titulo}"></td>
            <td th:text="${p.usuario.nombre}"></td>
            <td th:text="${p.fechaPrestamo}"></td>
            <td th:text="${p.fechaDevolucion} ?: 'Pendiente'"></td>
            <td>
                <a class="btn btn-sm btn-outline-success" th:if="${p.fechaDevolucion == null}"
                   th:href="@{/prestamos/devolucion/{id}(id=${p.id})}">Registrar devolucion</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
