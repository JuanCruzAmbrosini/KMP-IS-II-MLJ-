<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editoriales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Editoriales</h2>
        <a class="btn btn-primary" th:href="@{/editoriales/nuevo}">Nueva editorial</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Nombre</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${editoriales}">
            <td th:text="${e.nombre}"></td>
            <td>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/editoriales/editar/{id}(id=${e.id})}">Editar</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{/editoriales/baja/{id}(id=${e.id})}"
                   onclick="return confirm('¿Dar de baja esta editorial?')">Baja</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
