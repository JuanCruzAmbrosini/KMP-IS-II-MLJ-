<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Detalle - UTN Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <nav th:replace="components/navbar :: nav_bar"></nav>
    <section class="py-5" th:object="${videojuego}">
        <div class="container px-4 px-lg-5 my-5">
            <div class="row gx-4 gx-lg-5 align-items-center">
                <div class="col-md-6">
                    <img class="card-img-top mb-5 mb-md-0" th:src="@{'/imagenes/'}+*{imagen}" alt="portada del videojuego">
                </div>
                <div class="col-md-6">
                    <div class="small mb-1">SKU: VJ-<span th:text="*{id}">0</span></div>
                    <h1 class="display-5 fw-bolder" th:text="*{titulo}">Titulo</h1>
                    <div class="fs-4 mb-4">$<span th:text="*{precio}">0</span></div>
                    <p class="lead" th:text="*{descripcion}"></p>
                    <p th:if="*{stock}" class="fw-bolder text-success">
                        <i class="bi-check-circle me-1"></i>Stock disponible: <span th:text="*{stock}"></span>
                    </p>
                    <p th:unless="*{stock}" class="fw-bolder text-danger">
                        <i class="bi-x-circle me-1"></i>No hay stock
                    </p>
                    <a th:href="@{/inicio}" class="btn btn-outline-dark mt-3">
                        <i class="bi-arrow-left me-1"></i>Volver
                    </a>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
