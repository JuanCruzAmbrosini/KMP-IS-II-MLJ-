spring.datasource.url=${DB_URL:jdbc:sqlite:./videojuegos.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

#Variable de entorno
server.port=${SERVER_PORT:9000}

#Imagenes
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:15MB}
app.upload-dir=${UPLOAD_DIR:./uploads}

# Seguridad
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:change-me-please}
