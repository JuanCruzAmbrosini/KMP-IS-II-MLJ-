<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CRUD - UTN Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>
<section class="py-5">
<div class="container px-4 px-lg-5">
    <div class="row my-4 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bolder mb-0">Administrar catalogo</h2>
        </div>
        <div class="col-md-6 d-flex justify-content-md-end mt-3 mt-md-0">
            <a th:href="@{/formulario/videojuego/0}" class="btn btn-dark">
                <i class="bi-plus-lg me-1"></i>Agregar videojuego
            </a>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Titulo</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="videojuego : ${videojuegos}" th:classappend="${videojuego.activo} ? table-success : table-danger">
                <td th:text="${videojuego.id}"></td>
                <td th:text="${videojuego.titulo}"></td>
                <td>$<span th:text="${videojuego.precio}"></span></td>
                <td th:text="${videojuego.stock}"></td>
                <td>
                    <a th:href="@{/formulario/videojuego/{id}(id=${videojuego.id})}" class="btn btn-sm btn-outline-dark">Editar</a>
                    <a th:if="${videojuego.activo}" th:href="@{/eliminar/videojuego/{id}(id=${videojuego.id})}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
